<header class="topbar">

    <div>
        <h1>Inventario</h1>
        <p>Gestión visual de equipos tecnológicos.</p>
    </div>

    <form method="post" action="{% url 'logout' %}">
        {% csrf_token %}
        <button type="submit" class="logout-btn">
            Cerrar sesión
        </button>
    </form>

</header>

<section class="inventory-header">
    <div>
        <h2>Equipos registrados</h2>
        <p>Consulta, filtra y administra los equipos tecnológicos.</p>
    </div>

    <button
        type="button"
        class="primary-action"
        hx-get="{% url 'inventario:crear' %}"
        hx-target="#modal-container"
        hx-swap="innerHTML">
        + Registrar equipo
    </button>
</section>

<section class="inventory-tools" id="inventory-filters">

    <div class="search-box">
        <input
            type="text"
            name="q"
            value="{{ busqueda }}"
            placeholder="Buscar por nombre, código, marca o ubicación..."
            hx-get="{% url 'inventario:lista' %}"
            hx-target="#inventory-table-wrapper"
            hx-trigger="keyup changed delay:350ms"
            hx-include="#inventory-filters"
            hx-vals='{"partial": "tabla"}'>
    </div>

    <select
        name="estado"
        hx-get="{% url 'inventario:lista' %}"
        hx-target="#inventory-table-wrapper"
        hx-trigger="change"
        hx-include="#inventory-filters"
        hx-vals='{"partial": "tabla"}'>

        <option value="">Todos los estados</option>

        {% for valor, texto in estados %}
            <option value="{{ valor }}" {% if estado == valor %}selected{% endif %}>
                {{ texto }}
            </option>
        {% endfor %}
    </select>

    <select
        name="categoria"
        hx-get="{% url 'inventario:lista' %}"
        hx-target="#inventory-table-wrapper"
        hx-trigger="change"
        hx-include="#inventory-filters"
        hx-vals='{"partial": "tabla"}'>

        <option value="">Todas las categorías</option>

        {% for valor, texto in categorias %}
            <option value="{{ valor }}" {% if categoria == valor %}selected{% endif %}>
                {{ texto }}
            </option>
        {% endfor %}
    </select>

</section>

{% include 'pages/inventario/includes/tabla_equipos.html' %}

<div id="modal-container"></div>
