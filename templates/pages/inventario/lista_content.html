<header class="topbar">

    <div>
        <h1>Inventario</h1>
        <p>Gestión visual de equipos tecnológicos.</p>
    </div>

    <form method="post" action="{% url 'logout' %}">
        {% csrf_token %}
        <button type="submit" class="logout-btn">
            Cerrar sesión
        </button>
    </form>

</header>


<section class="inventory-header">

    <div>
        <h2>Equipos registrados</h2>
        <p>Consulta, filtra y administra los equipos tecnológicos.</p>
    </div>

    <button
        type="button"
        class="primary-action"
        hx-get="{% url 'inventario:crear' %}"
        hx-target="#modal-container"
        hx-swap="innerHTML">

        + Registrar equipo

    </button>

</section>


<!-- =====================================================
     HERRAMIENTAS DE BÚSQUEDA
     ===================================================== -->

<section class="inventory-tools" id="inventory-filters">

    <!-- BÚSQUEDA RÁPIDA -->

    <div class="search-box">

        <input
            type="text"
            name="q"
            value="{{ busqueda }}"
            placeholder="Buscar por código, nombre, marca, modelo, estado o ubicación..."
            hx-get="{% url 'inventario:lista' %}"
            hx-target="#inventory-table-wrapper"
            hx-trigger="keyup changed delay:350ms"
            hx-include="#inventory-filters"
            hx-vals='{"partial": "tabla"}'>

    </div>


    <!-- BOTÓN BÚSQUEDA AVANZADA -->

  <button
    type="button"
    class="advanced-search-btn"
    id="advanced-search-toggle"
    onclick="toggleBusquedaAvanzada()"
    aria-expanded="false">

    ⚙ Búsqueda avanzada

</button>


    <!-- =================================================
         FILTROS AVANZADOS
         Ocultos inicialmente
         ================================================= -->

    <div
        class="advanced-filters"
        id="advanced-filters"
        >

        <!-- FILTRO POR ESTADO -->

        <select
            name="estado"
            hx-get="{% url 'inventario:lista' %}"
            hx-target="#inventory-table-wrapper"
            hx-trigger="change"
            hx-include="#inventory-filters"
            hx-vals='{"partial": "tabla"}'>

            <option value="">
                Todos los estados
            </option>

            {% for valor, texto in estados %}

                <option
                    value="{{ valor }}"
                    {% if estado == valor %}selected{% endif %}>

                    {{ texto }}

                </option>

            {% endfor %}

        </select>


        <!-- FILTRO POR CATEGORÍA -->

        <select
            name="categoria"
            hx-get="{% url 'inventario:lista' %}"
            hx-target="#inventory-table-wrapper"
            hx-trigger="change"
            hx-include="#inventory-filters"
            hx-vals='{"partial": "tabla"}'>

            <option value="">
                Todas las categorías
            </option>

            {% for valor, texto in categorias %}

                <option
                    value="{{ valor }}"
                    {% if categoria == valor %}selected{% endif %}>

                    {{ texto }}

                </option>

            {% endfor %}

        </select>

    </div>

</section>


<!-- =====================================================
     TABLA DE EQUIPOS
     ===================================================== -->

{% include 'pages/inventario/includes/tabla_equipos.html' %}


<!-- =====================================================
     CONTENEDOR PARA MODALES
     ===================================================== -->

<div id="modal-container"></div>
